<style>
:root{color-scheme:dark;--bg:#07102b;--card:#101e47;--card2:#0d1838;--cy:#5ac8ff;--tx:#fff;--mu:#9aa8d0;--gr:#7ef0a4;--am:#ffb561;--disp:'Barlow Condensed','Arial Narrow',sans-serif;--body:'Inter',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#030814;font-family:var(--body);color:var(--tx);min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:16px}
button{font-family:inherit}
.phone{position:relative;width:100%;max-width:390px;height:800px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);background:var(--bg);border-radius:32px;display:flex;flex-direction:column;overflow:hidden;transition:background .5s;border:1px solid #1b2a5c}
.phone.dark-hour{background:#05120e;border-color:#14402e}
.screen{flex:1;overflow-y:auto;padding:28px 20px 40px;display:none}
.screen.on{display:block}
.disp{font-family:var(--disp);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.date{font-size:76px;line-height:.9;color:var(--cy)}
.dow{font-size:30px;letter-spacing:.06em}
.moon{text-align:right;color:var(--mu);font-size:13px;line-height:1.6}
.moon i{display:block;width:34px;height:34px;border-radius:50%;background:#1d2a5c;box-shadow:inset -10px 0 0 #dfe6ff;margin:0 0 8px auto}
.card{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:10px}
.ops{margin-top:20px}
.ops .list{flex:1;min-width:0}

function taskSheet(t){sheet(esc(t.t),'<button class="opt" data-a="tdone" data-id="'+t.id+'">'+(t.done?'Mark not done':'Mark done (+1 '+t.stat+')')+'</button><span class="lab">Reschedule to</span>'+PLAN.filter(function(s){return s.k!==t.slot}).map(function(s){return'<button class="opt" data-a="tmove" data-id="'+t.id+'" data-s="'+s.k+'">'+s.n+' · '+s.h+'</button>'}).join('')+'<button class="opt dg" data-a="tdel" data-id="'+t.id+'">Delete</button>',null)}
function code(){return btoa(unescape(encodeURIComponent(JSON.stringify({app:'moonbound',v:1,data:S}))))}
function expSheet(){sheet('Export data','<p class="lab" style="margin-top:0">Copy this code, send it to yourself, then use Import on the new phone.</p><textarea id="exp" readonly rows="6" style="font-size:12px">'+code()+'</textarea><button class="opt" data-a="copy" style="text-align:center">Copy code</button>',null)}
function impSheet(){sheet('Import data','<p class="lab" style="margin-top:0">Paste a backup code. This replaces everything on this device.</p><textarea id="imp" rows="6" style="font-size:12px"></textarea><div id="err" class="none" style="color:#ff9a8a"></div>','Import',function(){var raw=V('imp');try{var j;try{j=JSON.parse(raw)}catch(e){j=JSON.parse(decodeURIComponent(escape(atob(raw))))}var d=j.data||j;if(!d.tasks||!d.bonds)throw 0;S=norm(d);fixNid();shuffleSug()}catch(e){$('err').textContent='That doesn’t look like a Moonbound backup.';return false}})}

function rDetail(){var b=by(S.bonds,detail);if(!b){closeSheet();return}
var h='<div class="panel"><div class="dhead"><label class="dph" for="dfile">'+(b.photo?'<img alt="" src="'+b.photo+'">':'<b class="disp">'+esc(b.num)+'</b>')+'<span>'+(b.photo?'Change photo':'Add photo')+'</span></label><input id="dfile" type="file" accept="image/*" hidden><div><b>'+esc(b.name)+'</b><p>'+esc(b.cat)+'</p></div></div>';
h+='<label for="dlab">Label</label><input id="dlab" maxlength="50" value="'+esc(b.cat)+'" placeholder="Fitness, Friends · Maya"><label for="dnotes">Notes</label><textarea id="dnotes" placeholder="Anything worth remembering">'+esc(b.notes)+'</textarea><span class="lab">To do together</span>';
h+=b.list.length?b.list.map(function(c,i){var late=c.due&&!c.d&&dd(c.due)<0;return'<div class="jrow"><button class="ck'+(c.d?' d':'')+'" data-a="dchk" data-i="'+i+'"><i>'+(c.d?'✓':'')+'</i><span>'+esc(c.t)+(c.due?'<small class="'+(late?'late':'')+'">'+(late?'Overdue · ':'Due ')+fd(c.due)+'</small>':'')+'</span></button><button class="x" data-a="ddel" data-i="'+i+'" aria-label="Delete">×</button></div>'}).join(''):'<div class="none">Nothing yet</div>';
h+='<div class="dadd"><input id="dti" maxlength="80" placeholder="Add a to-do"><button class="sm" data-a="dadd" style="padding:10px 14px">Add</button><input id="dtd" type="date" aria-label="Due date"></div>';
h+=delAsk?'<div class="hint" style="margin-top:14px">Delete <b>'+esc(b.name)+'</b> permanently? This can’t be undone.</div><div class="btns"><button class="btn" data-a="dno">Keep it</button><button class="btn p" style="background:#ff9a8a;border-color:#ff9a8a" data-a="dyes">Delete</button></div></div>':'<div class="two" style="margin-top:6px"><button class="opt" data-a="darch">'+(b.arch?'Unarchive':'Archive')+'</button><button class="opt dg" data-a="dask">Delete</button></div><div class="btns"><button class="btn p" data-a="cancel">Done</button></div></div>';
var s=$('sheet'),ns=document.activeElement&&(document.activeElement.id==='dnotes'||document.activeElement.id==='dlab');if(!ns){s.innerHTML=h;s.classList.add('on');s._ok=null}}

function rPlanner(){var h='<div class="panel"><h4>Planner</h4>',order=PLAN.map(function(x){return x.k});
if(!plForm){h+='<div class="chips2">'+DAYS14.map(function(i){var c=S.plan.filter(function(p){return p.date===ymd(i)}).length;return'<button class="chip'+(i===plDay?' on':'')+'" data-a="pday" data-i="'+i+'">'+dl(i)+(c?'<em>'+c+'</em>':'')+'</button>'}).join('')+'</div>';
var it=S.plan.filter(function(p){return p.date===ymd(plDay)}).sort(function(a,b){return order.indexOf(a.slot)-order.indexOf(b.slot)});
h+=it.length?it.map(function(p){return'<button class="prow" data-a="pedit" data-id="'+p.id+'"><small>'+slotN(p.slot)+'</small><span>'+esc(p.t)+'</span><em>'+p.stat.toUpperCase()+'</em></button>'}).join(''):'<p class="none">Nothing planned for '+dl(plDay)+' yet.</p>';
h+='<button class="addop" data-a="pnew">+ Plan a task</button><div class="btns"><button class="btn p" data-a="cancel">Done</button></div></div>'}
else{var p=plEdit?by(S.plan,plEdit):null;curLib=S.lib.slice().sort(function(a,b){return a.t.localeCompare(b.t)});
var idx=p?curLib.map(function(x){return x.t.toLowerCase()}).indexOf(p.t.toLowerCase()):0,sel=p?(idx<0?'__new':String(idx)):(curLib.length?'0':'__new'),d0=p||curLib[0]||{slot:'early',stat:'Courage'};
h+='<span class="lab" style="margin-top:0">'+(p?'Edit task':'Plan a task')+'</span><label for="f0">What do you need to do?</label><select id="f0">'+curLib.map(function(x,i){return'<option value="'+i+'"'+(String(i)===sel?' selected':'')+'>'+esc(x.t)+'</option>'}).join('')+'<option value="__new"'+(sel==='__new'?' selected':'')+'>+ Write something new</option></select><input id="f1" maxlength="80" placeholder="Name it" value="'+(sel==='__new'&&p?esc(p.t):'')+'" style="display:'+(sel==='__new'?'block':'none')+';margin-top:8px"><div class="lab" style="margin-top:6px">Pick from your list to keep entries consistent.</div><label for="f2">When</label><select id="f2">'+PLAN.map(function(x){return'<option value="'+x.k+'"'+(x.k===d0.slot?' selected':'')+'>'+x.n+' ('+x.h+')</option>'}).join('')+'</select><label for="f3">Social stat</label><select id="f3">'+STATS.map(function(x){return'<option'+(x===d0.stat?' selected':'')+'>'+x+'</option>'}).join('')+'</select><label for="f4">Day</label><select id="f4">'+DAYS14.map(function(i){return'<option value="'+ymd(i)+'"'+(ymd(i)===(p?p.date:ymd(plDay))?' selected':'')+'>'+dl(i)+'</option>'}).join('')+'</select>'+(p?'<button class="opt dg" data-a="pdel" data-id="'+p.id+'">Delete task</button>':'')+'<div class="btns"><button class="btn" data-a="pback">Back</button><button class="btn p" data-a="psave">'+(p?'Save':'Add')+'</button></div></div>'}
var s=$('sheet');s.innerHTML=h;s.classList.add('on');s._ok=null}
function by(arr,id){return arr.filter(function(x){return x.id==id})[0]}
document.addEventListener('change',function(e){if(e.target.id==='f0'){var v=e.target.value;$('f1').style.display=v==='__new'?'block':'none';if(v==='__new')$('f1').focus();else fillFrom(+v);return}var f=e.target.files&&e.target.files[0];if(!f)return;if(e.target.id==='f3')pick(f,function(u){tmpPhoto=u});if(e.target.id==='dfile')pick(f,function(u){var b=by(S.bonds,detail);if(b){b.photo=u;render()}})});
document.addEventListener('input',function(e){if(e.target.id==='dnotes'){var b=by(S.bonds,detail);if(b){b.notes=e.target.value;save()}}if(e.target.id==='dlab'){var b2=by(S.bonds,detail);if(b2){b2.cat=e.target.value;save()}}});
document.addEventListener('click',function(e){
var s=$('sheet');if(e.target===s){closeSheet();render();return}
var t=e.target.closest('[data-a]');if(!t)return;var a=t.dataset.a,id=t.dataset.id;
if(a==='tab'){tab=t.dataset.s;['today','bonds','dark','journal'].forEach(function(x){$(x).classList.toggle('on',x===tab)});document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b===t)});$('phone').classList.toggle('dark-hour',tab==='dark');return}
if(a==='fab'){composeAct();return}
if(a==='tcomp'){composeTask();return}
if(a==='tplan'){plOpen=true;plForm=false;plEdit=null;plDay=1;rPlanner();return}
if(a==='pday'){plDay=+t.dataset.i;rPlanner();return}
if(a==='pnew'){plForm=true;plEdit=null;rPlanner();return}
if(a==='pedit'){plForm=true;plEdit=+id;rPlanner();return}
if(a==='pback'){plForm=false;plEdit=null;rPlanner();return}
if(a==='pdel'){S.plan=S.plan.filter(function(x){return x.id!=id});plForm=false;plEdit=null;render();return}
if(a==='psave'){var pv=$('f0').value,pt,pe;if(pv==='__new'){pt=V('f1');if(!pt)return;pe=S.lib.filter(function(x){return x.t.toLowerCase()===pt.toLowerCase()})[0];if(pe)pt=pe.t;else S.lib.push({t:pt,stat:$('f3').value,slot:$('f2').value,last:Date.now()})}else pt=curLib[+pv].t;var pd=$('f4').value;if(plEdit){var pq=by(S.plan,plEdit);pq.t=pt;pq.slot=$('f2').value;pq.stat=$('f3').value;pq.date=pd}else S.plan.push({id:++nid,t:pt,slot:$('f2').value,stat:$('f3').value,date:pd});var po=dd(pd);if(po>=1&&po<=14)plDay=po;plForm=false;plEdit=null;render();return}
if(a==='bcomp'){composeBond();return}
if(a==='opadd'){opSheet(null);return}
if(a==='op'){opSheet(by(S.ops,id));return}
if(a==='cancel'){closeSheet();render();return}
if(a==='ok'){if(s._ok()===false)return;closeSheet();render();return}
if(a==='task'){taskSheet(by(S.tasks,id));return}
if(a==='exp'){expSheet();return}
if(a==='imp'){impSheet();return}
if(a==='copy'){var ta=$('exp');ta.select();var ok=false;try{ok=document.execCommand('copy')}catch(x){}t.textContent=ok?'Copied':'Select all and copy';return}
if(a==='bond'){detail=+id;delAsk=false;rDetail();return}
if(a==='dask'){delAsk=true;rDetail();return}
if(a==='dno'){delAsk=false;rDetail();return}
if(a==='dyes'){S.bonds=S.bonds.filter(function(x){return x.id!=detail});closeSheet();render();return}
if(a==='dchk'){var c=by(S.bonds,detail).list[+t.dataset.i];c.d=!c.d;render();return}
if(a==='ddel'){by(S.bonds,detail).list.splice(+t.dataset.i,1);render();return}
if(a==='dadd'){var v=V('dti');if(!v)return;var o={t:v,d:false},dv=$('dtd').value;if(dv)o.due=dv;by(S.bonds,detail).list.push(o);render();return}
if(a==='darch'){var bb=by(S.bonds,detail);bb.arch=!bb.arch;closeSheet();render();return}
if(a==='tarch'){showArch=!showArch;render();return}
if(a==='sug'){S.jr.unshift({id:++nid,t:sug[+t.dataset.i],d:false});shuffleSug()}
if(a==='shuf'){shuffleSug()}
if(a==='tdone'){var k=by(S.tasks,id);k.done=!k.done;if(k.done){k.ym=ym();addPt(k.stat,k.ym,1);touch(k)}else addPt(k.stat,k.ym||ym(),-1)}
if(a==='tmove'){var k2=by(S.tasks,id);k2.slot=t.dataset.s;if(k2.done){k2.done=false;addPt(k2.stat,k2.ym||ym(),-1)}}
if(a==='tdel'){S.tasks=S.tasks.filter(function(x){return x.id!=id})}
if(a==='opdel'){S.ops=S.ops.filter(function(x){return x.id!=id})}
if(a==='start'){by(S.acts,id).since=Date.now()}
if(a==='pause'){var y=by(S.acts,id);y.acc+=Date.now()-y.since;y.since=null}
if(a==='end'){var z=by(S.acts,id),ms=el(z);if(ms>=1000)S.hist.unshift({name:z.name,at:Date.now(),ms:ms});z.acc=0;z.since=null}
if(a==='adel'){S.acts=S.acts.filter(function(x){return x.id!=id})}
if(a==='aarch'){by(S.acts,id).arch=true}
if(a==='aunarch'){by(S.acts,id).arch=false}
if(a==='tarchA'){showArchA=!showArchA}
if(a==='jadd'){var jv=$('jin').value.trim();if(!jv)return;S.jr.unshift({id:++nid,t:jv,d:false})}
if(a==='jt'){var j=by(S.jr,id);j.d=!j.d}
if(a==='jdel'){var jd=by(S.jr,id);if(jd)S.jtrash.unshift(jd);S.jr=S.jr.filter(function(x){return x.id!=id})}
if(a==='jres'){var j2=by(S.jtrash,id);if(j2){S.jr.unshift(j2);S.jtrash=S.jtrash.filter(function(x){return x.id!=id})}}
if(a==='jtr'){showTrash=!showTrash}
closeSheet();render()});
document.addEventListener('keydown',function(e){if(e.key!=='Enter')return;var i=e.target;if(i.id==='jin')document.querySelector('[data-a=jadd]').click();else if(i.id==='dti')document.querySelector('[data-a=dadd]').click();else if(i.tagName==='INPUT'&&i.type!=='file'&&$('sheet').classList.contains('on')){var o=document.querySelector('[data-a=ok]');if(o)o.click()}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
var lastSlot=curSlot();setInterval(function(){if(rollPlan())render();if(lastSlot!==curSlot()){lastSlot=curSlot();rToday()}},30000);
setInterval(function(){if(tab!=='dark')return;var tot=today().reduce(function(s,x){return counts(x.name)?s+x.ms:s},0);S.acts.forEach(function(a){if(counts(a.name))tot+=el(a);var n=document.querySelector('.tm[data-id="'+a.id+'"]');if(n)n.textContent=fmt(el(a))});var t=$('tot');if(t)t.textContent=fmtHM(tot)},1000);
render();
</script>
</body>
</html>
